spring:
  application:
    name: productmng
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 75s
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
loadup:
  webmvc:
    request-body:
      path-prefix: /api/
      max-size: 1MB
  security:
    resource-server:
      enabled: true
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${spring.application.name}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
