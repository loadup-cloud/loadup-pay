spring:
  main:
    web-application-type: none
loadup:
  database:
    multi-tenant:
      enabled: true
      required: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  delayedtask:
    enabled: true
    max-attempts: 1
  outbox:
    worker-enabled: false
  security:
    resource-server:
      enabled: false
    service-auth:
      token-uri: https://oauth2-server.invalid/oauth2/token
      client-secret: test-service-secret
      registrations:
        internal:
          scopes:
            - internal
  kms:
    enabled: false
