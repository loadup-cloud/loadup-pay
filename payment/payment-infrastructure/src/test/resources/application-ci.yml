spring:
  main:
    web-application-type: none
loadup:
  database:
    multi-tenant:
      enabled: true
      required: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  delayedtask:
    enabled: true
    max-attempts: 1
  outbox:
    worker-enabled: false
  security:
    resource-server:
      enabled: false
  kms:
    enabled: false
