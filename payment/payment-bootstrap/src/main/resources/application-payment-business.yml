# Build with -Ppayment-business, then activate this runtime profile.
spring:
  datasource:
    url: ${PAYMENT_JDBC_URL}
    username: ${PAYMENT_JDBC_USERNAME}
    password: ${PAYMENT_JDBC_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
loadup:
  modules:
    payment:
      limitcenter-service-id: ${PAYMENT_LIMITCENTER_SERVICE_ID:limitcenter}
      acquire-service-id: ${PAYMENT_ACQUIRE_SERVICE_ID:acquire}
      channel-management-service-id: ${PAYMENT_CHANNEL_MANAGEMENT_SERVICE_ID:pay-ops}
      realtime:
        tenant-id: ${PAYMENT_REALTIME_TENANT_ID:${PAYMENT_LIMITCENTER_TENANT_ID}}
        service-id: ${PAYMENT_SERVICE_ID:payment}
        audience: ${REALTIME_JWT_AUDIENCE}
        token-file: ${PAYMENT_REALTIME_TOKEN_FILE}
      acquire:
        tenant-id: ${PAYMENT_ACQUIRE_TENANT_ID:${PAYMENT_LIMITCENTER_TENANT_ID}}
        service-id: ${PAYMENT_SERVICE_ID:payment}
        audience: ${ACQUIRE_JWT_AUDIENCE}
        token-file: ${PAYMENT_ACQUIRE_TOKEN_FILE}
      limitcenter:
        tenant-id: ${PAYMENT_LIMITCENTER_TENANT_ID}
        service-id: ${PAYMENT_SERVICE_ID:payment}
        audience: ${LIMITCENTER_JWT_AUDIENCE}
        token-file: ${PAYMENT_LIMITCENTER_TOKEN_FILE}
      input:
        lifetime-seconds: ${PAYMENT_INPUT_LIFETIME_SECONDS:120}
        encryption-key: ${PAYMENT_INPUT_ENCRYPTION_KEY:payment-input}
        active-fingerprint-key-id: ${PAYMENT_INPUT_FINGERPRINT_KEY_ID:v1}
        fingerprint-keys:
          v1: ${PAYMENT_INPUT_FINGERPRINT_KEY}
  http:
    enabled: true
    clients:
      realtime:
        base-url: ${REALTIME_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 65536
        max-response-bytes: 65536
        operations:
          refund:
            method: POST
            path: /api/realtime/projections/refund
            headers:
              Content-Type: application/json
              Accept: application/json
          refund-summary:
            method: POST
            path: /api/realtime/projections/refund-summary
            headers:
              Content-Type: application/json
              Accept: application/json
          payment:
            method: POST
            path: /api/realtime/projections/payment
            headers:
              Content-Type: application/json
              Accept: application/json
      acquire:
        base-url: ${ACQUIRE_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 65536
        max-response-bytes: 65536
        operations:
          payment-outcome:
            method: POST
            path: /api/acquire/events/payment-outcome
            headers:
              Content-Type: application/json
              Accept: application/json
      limitcenter:
        base-url: ${LIMITCENTER_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 65536
        max-response-bytes: 65536
        operations:
          reserve:
            method: POST
            path: /api/limitcenter/reservations/reserve
            headers:
              Content-Type: application/json
              Accept: application/json
          begin:
            method: POST
            path: /api/limitcenter/executions/begin
            headers:
              Content-Type: application/json
              Accept: application/json
          verify:
            method: POST
            path: /api/limitcenter/executions/verify
            headers:
              Content-Type: application/json
              Accept: application/json
          confirm:
            method: POST
            path: /api/limit/settlement/confirm
            headers:
              Content-Type: application/json
              Accept: application/json
          release:
            method: POST
            path: /api/limit/settlement/release
            headers:
              Content-Type: application/json
              Accept: application/json
  kms:
    enabled: true
    endpoint: ${PAYMENT_KMS_ENDPOINT}
    token-env: PAYMENT_KMS_TOKEN
    management-enabled: false
    allow-insecure-http: ${PAYMENT_KMS_ALLOW_INSECURE_HTTP:false}
    connect-timeout: 2s
    read-timeout: 2s
    max-input-bytes: 65536
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${PAYMENT_JWT_ISSUER_URI}
      audience: ${PAYMENT_JWT_AUDIENCE}
      jwk-set-uri: ${PAYMENT_JWT_JWK_SET_URI}
management:
  endpoint:
    health:
      group:
        readiness:
          include: [readinessState, db]
