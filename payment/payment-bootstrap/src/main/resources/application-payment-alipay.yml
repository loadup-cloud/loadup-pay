# Optional runtime profile, combined with payment-business. No credential values belong here.
loadup:
  pay:
    channel:
      alipay:
        enabled: true
        # Supply credentials/authorizations reference -> version -> absolute Path maps through trusted configuration.
        # Direct H5 additionally requires h5.gateway and notifications.notify-urls.<tenant>.<binding-revision>.
        # h5.return-urls.<tenant>.<binding-revision> is optional; return pages must query the original payment.
        # H5 is unavailable when gateway is absent. Do not expose delegated app_auth_token through browser actions.
  http:
    enabled: true
    clients:
      alipay:
        base-url: ${PAYMENT_ALIPAY_GATEWAY_BASE_URL:https://openapi.alipay.com}
        connect-timeout: 3s
        read-timeout: 20s
        acquire-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 262144
        max-response-bytes: 1048576
        operations:
          bill-download-url:
            method: POST
            path: /gateway.do
          trade-pay:
            method: POST
            path: /gateway.do
          trade-create:
            method: POST
            path: /gateway.do
          trade-query:
            method: POST
            path: /gateway.do
          trade-close:
            method: POST
            path: /gateway.do
          trade-refund:
            method: POST
            path: /gateway.do
          refund-query:
            method: POST
            path: /gateway.do
