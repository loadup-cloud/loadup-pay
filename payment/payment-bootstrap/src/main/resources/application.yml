spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${PAYMENT_JDBC_URL}
    username: ${PAYMENT_JDBC_USERNAME}
    password: ${PAYMENT_JDBC_PASSWORD}
  application:
    name: payment
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]

# Shared recovery/query/close admission per JVM and channel; no first-submit decoration.
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 32MB
  http:
    client:
    clients:
      acquire:
        base-url: ${ACQUIRE_BASE_URL:http://acquire:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-request-bytes: 33554432
        max-response-bytes: 33554432
      realtime:
        base-url: ${REALTIME_BASE_URL:http://realtime:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-request-bytes: 33554432
        max-response-bytes: 33554432
      limitcenter:
        base-url: ${LIMITCENTER_BASE_URL:http://limitcenter:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
  resilience4j:
    enabled: true
    binder-type: core
  modules:
    payment:
      reconciliation-service-id: ${PAYMENT_RECONCILIATION_SERVICE_ID:reconciliation}
      reconciliation:
        max-records: ${PAYMENT_RECONCILIATION_MAX_RECORDS:10000}
        source-read-timeout-seconds: ${PAYMENT_RECONCILIATION_READ_TIMEOUT_SECONDS:10}
      limitcenter-service-id: ${PAYMENT_LIMITCENTER_SERVICE_ID:limitcenter}
      acquire-service-id: ${PAYMENT_ACQUIRE_SERVICE_ID:acquire}
      recovery-operations-service-id: ${PAYMENT_RECOVERY_OPERATIONS_SERVICE_ID:pay-ops}
      channel-management-service-id: ${PAYMENT_CHANNEL_MANAGEMENT_SERVICE_ID:pay-ops}
      recovery-polling:
        initial-delay-seconds: ${PAYMENT_RECOVERY_INITIAL_DELAY_SECONDS:30}
        maximum-delay-seconds: ${PAYMENT_RECOVERY_MAXIMUM_DELAY_SECONDS:1800}
        backoff-every-seconds: ${PAYMENT_RECOVERY_BACKOFF_EVERY_SECONDS:900}
        jitter-percent: ${PAYMENT_RECOVERY_JITTER_PERCENT:20}
      recovery-escalation:
        review-after-seconds: ${PAYMENT_RECOVERY_REVIEW_AFTER_SECONDS:900}
        urgent-after-seconds: ${PAYMENT_RECOVERY_URGENT_AFTER_SECONDS:86400}
      recovery-inventory:
        enabled: ${PAYMENT_RECOVERY_INVENTORY_ENABLED:false}
        tenant-ids: ${PAYMENT_RECOVERY_INVENTORY_TENANTS:}
        interval-seconds: ${PAYMENT_RECOVERY_INVENTORY_INTERVAL_SECONDS:300}
      input:
        lifetime-seconds: ${PAYMENT_INPUT_LIFETIME_SECONDS:120}
        encryption-key: ${PAYMENT_INPUT_ENCRYPTION_KEY:payment-input}
        active-fingerprint-key-id: ${PAYMENT_INPUT_FINGERPRINT_KEY_ID:v1}
        fingerprint-keys:
          v1: ${PAYMENT_INPUT_FINGERPRINT_KEY}
  kms:
    enabled: false
    binder: local
  delayedtask:
    enabled: true
    batch-size: ${PAYMENT_TASK_BATCH_SIZE:100}
    max-attempts: ${PAYMENT_TASK_MAX_ATTEMPTS:5}
    lease: ${PAYMENT_TASK_LEASE:PT5M}
    retry-delay: ${PAYMENT_TASK_RETRY_DELAY:PT1M}
  scheduler:
    binder-type: local
    local:
      interval: ${PAYMENT_SCAN_INTERVAL:PT30S}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    service-auth:
      token-uri: ${SERVICE_AUTH_TOKEN_URI:http://authserver:8080/oauth2/token}
      allow-insecure-http: ${SERVICE_AUTH_ALLOW_INSECURE_HTTP:false}
      client-secret: ${SERVICE_AUTH_CLIENT_SECRET}
      registrations:
        acquire:
          client-id: ${PAYMENT_ACQUIRE_OAUTH_CLIENT_ID:payment.default.acquire}
          tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
          service-id: payment
          audience: acquire
          scopes:
            - pay:acquire:payment:outcome
            - pay:acquire:fee:refund
            - pay:acquire:refund:notification
        limitcenter:
          client-id: ${PAYMENT_LIMITCENTER_OAUTH_CLIENT_ID:payment.default.limitcenter}
          tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
          service-id: payment
          audience: limitcenter
          scopes:
            - pay:limit:reserve
            - pay:limit:read
            - pay:limit:execute
            - pay:limit:verify
            - pay:limit:expire
            - pay:limit:confirm
            - pay:limit:release
            - pay:limit:refund:restore
        realtime:
          client-id: ${PAYMENT_REALTIME_OAUTH_CLIENT_ID:payment.default.realtime}
          tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
          service-id: payment
          audience: realtime
          scopes:
            - pay:realtime:projection:payment
            - pay:realtime:projection:refund
            - pay:realtime:projection:refund-summary
    resource-server:
      enabled: true
      permit-all:
        - /api/payment/channel-callbacks/*
        - /api/payment/channel-callbacks/*/refund
      issuer-uri: ${PAYMENT_JWT_ISSUER_URI:${JWT_ISSUER_URI:}}
      audience: ${PAYMENT_JWT_AUDIENCE:payment}
      jwk-set-uri: ${PAYMENT_JWT_JWK_SET_URI:${JWT_JWK_SET_URI:}}
      public-key-location: ${PAYMENT_JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION:}}

resilience4j:
  bulkhead:
    instances:
      payment-channel-recovery-alipay:
        max-concurrent-calls: ${PAYMENT_ALIPAY_RECOVERY_MAX_CONCURRENT:16}
        max-wait-duration: 0ms
      payment-channel-recovery-wechat:
        max-concurrent-calls: ${PAYMENT_WECHAT_RECOVERY_MAX_CONCURRENT:16}
        max-wait-duration: 0ms
      payment-channel-recovery-unionpay:
        max-concurrent-calls: ${PAYMENT_UNIONPAY_RECOVERY_MAX_CONCURRENT:16}
        max-wait-duration: 0ms
