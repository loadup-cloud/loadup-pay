spring:
  grpc:
    server:
      port: ${pay.grpc-port}
      ssl:
        enabled: false
  application:
    name: payment
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
pay:
  grpc-port: ${GRPC_PORT:9090}
