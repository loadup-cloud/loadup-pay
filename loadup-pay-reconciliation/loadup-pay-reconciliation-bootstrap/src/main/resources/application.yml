# Supply the closed account catalog from external configuration; no account is authorized by default.
spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  servlet:
    multipart:
      max-file-size: ${RECONCILIATION_STATEMENT_MAX_BYTES:16777216}B
      max-request-size: ${RECONCILIATION_IMPORT_MAX_REQUEST_SIZE:17MB}
  datasource:
    url: ${RECONCILIATION_JDBC_URL}
    username: ${RECONCILIATION_JDBC_USERNAME}
    password: ${RECONCILIATION_JDBC_PASSWORD}
  application:
    name: reconciliation
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 32MB
  http:
    clients:
      # Named after the client role, so the payment target needs an explicit origin.
      payment-statements:
        base-url: ${PAYMENT_BASE_URL:http://payment:8080}
        allow-private-addresses: true
        read-timeout: 60s
        max-connections: 8
        max-connections-per-route: 4
        max-response-bytes: 33554432
  outbox:
    worker-enabled: ${RECONCILIATION_VERIFICATION_WORKER_ENABLED:true}
    lease: ${RECONCILIATION_VERIFICATION_DELIVERY_LEASE:PT2M}
    retry-delay: ${RECONCILIATION_VERIFICATION_RETRY_DELAY:PT5S}
    max-attempts: ${RECONCILIATION_VERIFICATION_MAX_ATTEMPTS:8}
    batch-size: ${RECONCILIATION_VERIFICATION_BATCH_SIZE:10}
  dfs:
    enabled: true
    binder-type: s3
    binder:
      s3:
        bucket: ${RECONCILIATION_S3_BUCKET}
        region: ${RECONCILIATION_S3_REGION:us-east-1}
        endpoint: ${RECONCILIATION_S3_ENDPOINT:}
        access-key: ${RECONCILIATION_S3_ACCESS_KEY:}
        secret-key: ${RECONCILIATION_S3_SECRET_KEY:}
        path-style-access-enabled: ${RECONCILIATION_S3_PATH_STYLE:false}
        create-bucket: false
        key-prefix: reconciliation
  modules:
    file:
      enabled: true
    transfer:
      enabled: true
      max-input-bytes: ${RECONCILIATION_STATEMENT_MAX_BYTES:16777216}
      dispatch-batch-size: ${RECONCILIATION_IMPORT_BATCH_SIZE:10}
    reconciliation:
      ledger-fetch-seconds: ${RECONCILIATION_LEDGER_FETCH_SECONDS:60}
      max-records: ${RECONCILIATION_MAX_RECORDS:10000}
      statement-max-bytes: ${RECONCILIATION_STATEMENT_MAX_BYTES:16777216}
      accounts:
        tenants: { }
  delayedtask:
    enabled: true
    batch-size: ${RECONCILIATION_TASK_BATCH_SIZE:10}
    max-attempts: ${RECONCILIATION_TASK_MAX_ATTEMPTS:5}
    lease: ${RECONCILIATION_TASK_LEASE:PT5M}
    retry-delay: ${RECONCILIATION_TASK_RETRY_DELAY:PT1M}
  scheduler:
    binder-type: local
    local:
      interval: ${RECONCILIATION_SCAN_INTERVAL:PT30S}
  database:
    multi-tenant:
      enabled: false
      required: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/pay/reconciliation
      - classpath:db/migration/framework/file
      - classpath:db/migration/framework/transfer
  security:
    service-auth:
      token-uri: ${SERVICE_AUTH_TOKEN_URI:http://oauth2-server:8080/oauth2/token}
      allow-insecure-http: ${SERVICE_AUTH_ALLOW_INSECURE_HTTP:false}
      client-secret: ${SERVICE_AUTH_CLIENT_SECRET}
      registrations:
        payment:
          scopes:
            - internal
    resource-server:
      enabled: true
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${spring.application.name}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
