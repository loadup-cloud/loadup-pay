spring:
  main:
    web-application-type: none
  datasource:
    driver-class-name: org.postgresql.Driver
loadup:
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    resource-server:
      enabled: false
    service-auth:
      token-uri: https://oauth2-server.invalid/oauth2/token
      client-secret: test-service-secret
      registrations:
        internal:
          scopes:
            - internal
