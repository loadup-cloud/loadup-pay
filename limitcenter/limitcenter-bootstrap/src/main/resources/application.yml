spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${LIMITCENTER_JDBC_URL}
    username: ${LIMITCENTER_JDBC_USERNAME}
    password: ${LIMITCENTER_JDBC_PASSWORD}
  application:
    name: limitcenter
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 1MB
  modules:
    limitcenter:
      payment-service-id: ${LIMITCENTER_PAYMENT_SERVICE_ID:payment}
      reserve-seconds: ${LIMITCENTER_RESERVE_SECONDS:120}
      permit:
        active-key-id: ${LIMITCENTER_PERMIT_ACTIVE_KEY_ID:v1}
        keys:
          v1: ${LIMITCENTER_PERMIT_SECRET}
  database:
    multi-tenant:
      enabled: false
      required: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    service-auth:
      token-uri: ${SERVICE_AUTH_TOKEN_URI:http://oauth2-server:8080/oauth2/token}
      allow-insecure-http: ${SERVICE_AUTH_ALLOW_INSECURE_HTTP:false}
      client-secret: ${SERVICE_AUTH_CLIENT_SECRET}
      registrations:
        payment:
          scopes:
            - internal
    resource-server:
      enabled: true
      issuer-uri: ${JWT_ISSUER_URI:}
      audience: ${spring.application.name}
      jwk-set-uri: ${JWT_JWK_SET_URI:}
