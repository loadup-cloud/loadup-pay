spring:
  datasource:
    url: ${LIMITCENTER_JDBC_URL}
    username: ${LIMITCENTER_JDBC_USERNAME}
    password: ${LIMITCENTER_JDBC_PASSWORD}
  application:
    name: limitcenter
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: limitcenter
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.limitcenter
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  registry:
    address: N/A
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  modules:
    limitcenter:
      payment-service-id: ${LIMITCENTER_PAYMENT_SERVICE_ID:payment}
      payment-evidence:
        tenant-id: ${LIMITCENTER_PAYMENT_TENANT_ID}
        service-id: ${LIMITCENTER_SERVICE_ID:limitcenter}
        audience: ${PAYMENT_JWT_AUDIENCE}
        token-file: ${LIMITCENTER_PAYMENT_TOKEN_FILE}
      reserve-seconds: ${LIMITCENTER_RESERVE_SECONDS:120}
      permit:
        active-key-id: ${LIMITCENTER_PERMIT_ACTIVE_KEY_ID:v1}
        keys:
          v1: ${LIMITCENTER_PERMIT_SECRET}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${LIMITCENTER_JWT_ISSUER_URI}
      audience: ${LIMITCENTER_JWT_AUDIENCE}
      jwk-set-uri: ${LIMITCENTER_JWT_JWK_SET_URI}
