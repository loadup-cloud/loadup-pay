spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${LIMITCENTER_JDBC_URL}
    username: ${LIMITCENTER_JDBC_USERNAME}
    password: ${LIMITCENTER_JDBC_PASSWORD}
  application:
    name: limitcenter
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 1MB
  http:
    clients:
      payment:
        base-url: ${PAYMENT_BASE_URL:http://payment:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-request-bytes: 33554432
        max-response-bytes: 33554432
  modules:
    limitcenter:
      payment-service-id: ${LIMITCENTER_PAYMENT_SERVICE_ID:payment}
      reserve-seconds: ${LIMITCENTER_RESERVE_SECONDS:120}
      permit:
        active-key-id: ${LIMITCENTER_PERMIT_ACTIVE_KEY_ID:v1}
        keys:
          v1: ${LIMITCENTER_PERMIT_SECRET}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${LIMITCENTER_JWT_ISSUER_URI}
      audience: ${LIMITCENTER_JWT_AUDIENCE:limitcenter}
      jwk-set-uri: ${LIMITCENTER_JWT_JWK_SET_URI}
