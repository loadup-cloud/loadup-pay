spring:
  application:
    name: reconciliation
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: reconciliation
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.reconciliation
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  registry:
    address: N/A
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
