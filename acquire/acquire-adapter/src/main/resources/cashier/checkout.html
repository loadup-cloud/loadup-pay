<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="no-referrer" name="referrer">
    <title>订单详情</title>
    <link href="/checkout.css" rel="stylesheet">
    <script defer src="/checkout.js"></script>
</head>
<body>
<main>
    <p class="eyebrow">收银台</p>
    <h1>订单详情</h1>
    <p aria-live="polite" id="message" role="status">正在读取订单…</p>
    <section hidden id="order">
        <h2 id="subject"></h2>
        <dl>
            <div>
                <dt>订单号</dt>
                <dd id="order-id"></dd>
            </div>
            <div>
                <dt>订单总额</dt>
                <dd id="amount"></dd>
            </div>
            <div>
                <dt>累计付款</dt>
                <dd id="paid"></dd>
            </div>
            <div>
                <dt>付款处理中</dt>
                <dd id="held"></dd>
            </div>
            <div>
                <dt>可付金额</dt>
                <dd id="available"></dd>
            </div>
            <div>
                <dt>订单状态</dt>
                <dd id="state"></dd>
            </div>
        </dl>
    </section>
    <button disabled id="refresh" type="button">刷新状态</button>
</main>
</body>
</html>
