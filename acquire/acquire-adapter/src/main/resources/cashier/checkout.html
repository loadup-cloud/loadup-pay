<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="no-referrer" name="referrer">
    <title>收银台</title>
    <link href="/checkout.css" rel="stylesheet">
    <script src="/checkout.js" type="module"></script>
</head>
<body>
<main>
    <p class="eyebrow">收银台 · 人民币</p>
    <h1>确认本次付款</h1>
    <p aria-live="polite" id="message" role="status">正在读取订单…</p>
    <section aria-label="订单金额与状态" hidden id="order">
        <h2 id="subject"></h2>
        <dl>
            <div>
                <dt>订单号</dt>
                <dd id="order-id"></dd>
            </div>
            <div>
                <dt>订单总额</dt>
                <dd id="amount"></dd>
            </div>
            <div>
                <dt>累计已付</dt>
                <dd id="paid"></dd>
            </div>
            <div>
                <dt>付款处理中</dt>
                <dd id="held"></dd>
            </div>
            <div>
                <dt>当前可付</dt>
                <dd id="available"></dd>
            </div>
            <div>
                <dt>订单状态</dt>
                <dd id="state"></dd>
            </div>
        </dl>
    </section>
    <form hidden id="payment-form" novalidate>
        <h2>本次付款</h2>
        <label for="payment-amount">本次金额（元）</label>
        <input aria-describedby="amount-rules" autocomplete="off" id="payment-amount" inputmode="decimal" maxlength="20"
               name="amount" placeholder="请输入金额，例如 30.00" required type="text">
        <p class="hint" id="amount-rules"></p>
        <label for="payment-choice">付款方式</label>
        <select id="payment-choice" name="choice" required></select>
        <button disabled id="pay" type="submit">确认本次付款</button>
    </form>
    <section aria-label="本次付款进度" hidden id="payment-operation">
        <h2>本次操作</h2>
        <dl>
            <div>
                <dt>本次金额</dt>
                <dd id="payment-value"></dd>
            </div>
            <div>
                <dt>付款编号</dt>
                <dd id="payment-id"></dd>
            </div>
        </dl>
        <p class="hint" id="payment-status">结果未确认前请保留本次操作。</p>
    </section>
    <a class="primary-link" hidden id="launch" referrerpolicy="strict-origin" rel="noopener"
       target="_blank">前往支付页面</a>
    <button class="secondary" disabled id="refresh" type="button">刷新状态</button>
    <p class="hint">
        返回、关闭支付页或浏览器提示不代表支付成功。请以订单查询结果为准；重新打开原商户链接可恢复当前标签页的付款操作。</p>
    <noscript><p>此收银台需要启用 JavaScript。请使用商户提供的其他支付入口。</p></noscript>
</main>
</body>
</html>
