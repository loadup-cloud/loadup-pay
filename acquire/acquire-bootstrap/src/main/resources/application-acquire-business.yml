# Build with -Pacquire-business, then activate this runtime profile.
spring:
  datasource:
    url: ${ACQUIRE_JDBC_URL}
    username: ${ACQUIRE_JDBC_USERNAME}
    password: ${ACQUIRE_JDBC_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
loadup:
  modules:
    acquire:
      payment-service-id: ${ACQUIRE_PAYMENT_SERVICE_ID:payment}
      product-audience: ${PRODUCT_JWT_AUDIENCE}
      realtime:
        tenant-id: ${ACQUIRE_REALTIME_TENANT_ID:${ACQUIRE_PAYMENT_TENANT_ID}}
        service-id: ${ACQUIRE_SERVICE_ID:acquire}
        audience: ${REALTIME_JWT_AUDIENCE}
        token-file: ${ACQUIRE_REALTIME_TOKEN_FILE}
      payment:
        tenant-id: ${ACQUIRE_PAYMENT_TENANT_ID}
        service-id: ${ACQUIRE_SERVICE_ID:acquire}
        audience: ${PAYMENT_JWT_AUDIENCE}
        token-file: ${ACQUIRE_PAYMENT_TOKEN_FILE}
      checkout:
        page-url: ${ACQUIRE_CHECKOUT_PAGE_URL}
        key-ref: acquire-checkout
        active-key-version: ${ACQUIRE_CHECKOUT_ACTIVE_KEY_VERSION:v1}
        keys:
          v1: ${ACQUIRE_CHECKOUT_SECRET}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${ACQUIRE_JWT_ISSUER_URI}
      audience: ${ACQUIRE_JWT_AUDIENCE}
      jwk-set-uri: ${ACQUIRE_JWT_JWK_SET_URI}
  http:
    enabled: true
    clients:
      realtime:
        base-url: ${REALTIME_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 65536
        max-response-bytes: 16384
        operations:
          order:
            method: POST
            path: /api/realtime/projections/order
            headers:
              Content-Type: application/json
              Accept: application/json
      payment:
        base-url: ${PAYMENT_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 262144
        max-response-bytes: 262144
        operations:
          input-prepare:
            method: POST
            path: /api/payment/inputs/prepare
            headers:
              Content-Type: application/json
              Accept: application/json
          accept:
            method: POST
            path: /api/payment/executions/accept
            headers:
              Content-Type: application/json
              Accept: application/json
          detail:
            method: POST
            path: /api/payment/executions/detail
            headers:
              Content-Type: application/json
              Accept: application/json
          outcome:
            method: POST
            path: /api/payment/executions/outcome
            headers:
              Content-Type: application/json
              Accept: application/json
          facts:
            method: POST
            path: /api/payment/facts/payment
            headers:
              Content-Type: application/json
              Accept: application/json
          close:
            method: POST
            path: /api/payment/executions/close
            headers:
              Content-Type: application/json
              Accept: application/json
          fence-parent:
            method: POST
            path: /api/payment/executions/fence-parent
            headers:
              Content-Type: application/json
              Accept: application/json
          parent-fence-status:
            method: POST
            path: /api/payment/executions/parent-fence-status
            headers:
              Content-Type: application/json
              Accept: application/json
      product:
        base-url: ${PRODUCT_BASE_URL}
        allow-private-addresses: true
        connect-timeout: 2s
        read-timeout: 3s
        acquire-timeout: 1s
        max-request-bytes: 16384
        max-response-bytes: 262144
        operations:
          authorize:
            method: POST
            path: /api/product/admissions/authorize
            headers:
              Content-Type: application/json
              Accept: application/json
management:
  endpoint:
    health:
      group:
        readiness:
          include: [readinessState, db]
