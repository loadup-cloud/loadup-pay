spring:
  datasource:
    url: ${ACQUIRE_JDBC_URL}
    username: ${ACQUIRE_JDBC_USERNAME}
    password: ${ACQUIRE_JDBC_PASSWORD}
  application:
    name: acquire
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: acquire
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.acquire
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  delayedtask:
    enabled: true
    batch-size: ${ACQUIRE_TASK_BATCH_SIZE:100}
    max-attempts: ${ACQUIRE_TASK_MAX_ATTEMPTS:5}
    lease: ${ACQUIRE_TASK_LEASE:PT5M}
    retry-delay: ${ACQUIRE_TASK_RETRY_DELAY:PT1M}
  scheduler:
    binder-type: local
    local:
      interval: ${ACQUIRE_SCAN_INTERVAL:PT5S}
  modules:
    acquire:
      order-close:
        poll-delay-seconds: ${ACQUIRE_ORDER_CLOSE_POLL_DELAY_SECONDS:30}
      payment-recovery:
        poll-delay-seconds: ${ACQUIRE_PAYMENT_RECOVERY_POLL_DELAY_SECONDS:30}
      payment-service-id: ${ACQUIRE_PAYMENT_SERVICE_ID:payment}
      recovery-operations-service-id: ${ACQUIRE_RECOVERY_OPERATIONS_SERVICE_ID:pay-ops}
      notification-operations-service-id: ${ACQUIRE_NOTIFICATION_OPERATIONS_SERVICE_ID:pay-ops}
      product-audience: ${PRODUCT_JWT_AUDIENCE:${loadup.rpc.client.audience:product}}
      checkout:
        page-url: ${ACQUIRE_CHECKOUT_PAGE_URL:https://example.com/checkout }
        key-ref: acquire-checkout
        active-key-version: ${ACQUIRE_CHECKOUT_ACTIVE_KEY_VERSION:v1}
        keys:
          v1: ${ACQUIRE_CHECKOUT_SECRET:59b4837096b6c2d9ae214058f4d8b7c22be6db20378a72261d5449f12b948383}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${ACQUIRE_JWT_ISSUER_URI}
      audience: ${ACQUIRE_JWT_AUDIENCE:${loadup.rpc.client.audience:acquire}}
      jwk-set-uri: ${ACQUIRE_JWT_JWK_SET_URI}

---
spring:
  config:
    activate:
      on-profile: "!nacos"
dubbo:
  registry:
    address: N/A
  reference:
    "io.github.loadup.pay.payment.rpc.proto.PaymentRpc":
      url: tri://payment-headless:50051
    "io.github.loadup.pay.product.rpc.proto.ProductRpc":
      url: tri://product-headless:50051
    "io.github.loadup.pay.realtime.rpc.proto.RealtimeRpc":
      url: tri://realtime-headless:50051
