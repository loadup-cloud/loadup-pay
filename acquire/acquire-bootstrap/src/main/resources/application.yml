spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${ACQUIRE_JDBC_URL}
    username: ${ACQUIRE_JDBC_USERNAME}
    password: ${ACQUIRE_JDBC_PASSWORD}
  application:
    name: acquire
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 32MB
  http:
    client:
      tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
    clients:
      realtime:
        base-url: ${REALTIME_BASE_URL:http://realtime:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-request-bytes: 33554432
        max-response-bytes: 33554432
      payment:
        base-url: ${PAYMENT_BASE_URL:http://payment:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-request-bytes: 33554432
        max-response-bytes: 33554432
      product:
        base-url: ${PRODUCT_BASE_URL:http://product:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
  delayedtask:
    enabled: true
    batch-size: ${ACQUIRE_TASK_BATCH_SIZE:100}
    max-attempts: ${ACQUIRE_TASK_MAX_ATTEMPTS:5}
    lease: ${ACQUIRE_TASK_LEASE:PT5M}
    retry-delay: ${ACQUIRE_TASK_RETRY_DELAY:PT1M}
  scheduler:
    binder-type: local
    local:
      interval: ${ACQUIRE_SCAN_INTERVAL:PT5S}
  modules:
    acquire:
      order-close:
        poll-delay-seconds: ${ACQUIRE_ORDER_CLOSE_POLL_DELAY_SECONDS:30}
      payment-recovery:
        poll-delay-seconds: ${ACQUIRE_PAYMENT_RECOVERY_POLL_DELAY_SECONDS:30}
      payment-service-id: ${ACQUIRE_PAYMENT_SERVICE_ID:payment}
      recovery-operations-service-id: ${ACQUIRE_RECOVERY_OPERATIONS_SERVICE_ID:pay-ops}
      notification-operations-service-id: ${ACQUIRE_NOTIFICATION_OPERATIONS_SERVICE_ID:pay-ops}
      product-audience: ${PRODUCT_JWT_AUDIENCE:product}
      checkout:
        page-url: ${ACQUIRE_CHECKOUT_PAGE_URL:https://example.com/checkout }
        key-ref: acquire-checkout
        active-key-version: ${ACQUIRE_CHECKOUT_ACTIVE_KEY_VERSION:v1}
        keys:
          v1: ${ACQUIRE_CHECKOUT_SECRET:59b4837096b6c2d9ae214058f4d8b7c22be6db20378a72261d5449f12b948383}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    service-auth:
      token-uri: ${SERVICE_AUTH_TOKEN_URI:http://authserver:8080/oauth2/token}
      allow-insecure-http: ${SERVICE_AUTH_ALLOW_INSECURE_HTTP:false}
      client-secret: ${SERVICE_AUTH_CLIENT_SECRET}
      registrations:
        payment:
          client-id: ${ACQUIRE_PAYMENT_OAUTH_CLIENT_ID:acquire.default.payment}
          tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
          service-id: acquire
          audience: payment
          scopes:
            - pay:payment:input:prepare
            - pay:payment:input:read
            - pay:payment:input:expire
            - pay:payment:accept
            - pay:payment:read
            - pay:payment:fence
            - pay:payment:fence:read
            - pay:payment:close
            - pay:payment:attempt:start
            - pay:payment:acquire-facts
            - pay:payment:refund-summary:read
        realtime:
          client-id: ${ACQUIRE_REALTIME_OAUTH_CLIENT_ID:acquire.default.realtime}
          tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
          service-id: acquire
          audience: realtime
          scopes:
            - pay:realtime:projection:order
    resource-server:
      enabled: true
      issuer-uri: ${ACQUIRE_JWT_ISSUER_URI:${JWT_ISSUER_URI:}}
      audience: ${ACQUIRE_JWT_AUDIENCE:acquire}
      jwk-set-uri: ${ACQUIRE_JWT_JWK_SET_URI:${JWT_JWK_SET_URI:}}
      public-key-location: ${ACQUIRE_JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION:}}
