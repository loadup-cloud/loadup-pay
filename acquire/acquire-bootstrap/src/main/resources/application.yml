spring:
  application:
    name: acquire
  grpc:
    server:
      port: 50051
      inbound:
        message:
          max-size: 256KB
      shutdown:
        grace-period: 30s
    client:
      channel:
        realtime:
          target: dns:///realtime-headless:50051
          default:
            load-balancing-policy: round_robin
        payment:
          target: dns:///payment-headless:50051
          default:
            load-balancing-policy: round_robin
        product:
          target: dns:///product-headless:50051
          default:
            load-balancing-policy: round_robin
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
loadup:
  rpc:
    clients:
      realtime:
        channel: realtime
        deadline: 3s
      payment:
        channel: payment
        deadline: 3s
      product:
        channel: product
        deadline: 3s
