syntax = "proto3";
package loadup.pay.acquire.v1;
option java_package = "io.github.loadup.pay.acquire.rpc.proto";
option java_multiple_files = true;
import "google/protobuf/timestamp.proto";
import "payment.proto";

// This service owns these messages and permanent field numbers. Reserve deleted fields.
// Enum symbols are explicit strings; unknown symbols are rejected.

message WirePayEventEnvelopeOfPaymentOutcomeEventDTO {
  optional string delivery_id = 1;
  optional string business_event_id = 2;
  optional string producer = 3;
  optional string event_type = 4;
  optional int32 schema_version = 5;
  optional string aggregate_id = 6;
  optional int64 aggregate_version = 7;
  google.protobuf.Timestamp occurred_at = 8;
  loadup.pay.payment.v1.WirePaymentOutcomeEventDTO data = 9;
}

message WirePaymentOutcomeAckDTO {
  optional string delivery_id = 1;
  optional string business_event_id = 2;
  optional string payment_id = 3;
  optional int64 payment_version = 4;
  optional string evidence_id = 5;
  optional int64 order_version = 6;
  optional bool accepted = 7;
}

message WireOrderSnapshotEventDTO {
  optional string order_id = 1;
  optional string payee_merchant_id = 2;
  optional string merchant_order_no = 3;
  optional int64 amount_minor = 4;
  optional string currency = 5;
  optional int64 paid_amount_minor = 6;
  optional int64 payment_reserved_minor = 7;
  optional string state = 8;
  google.protobuf.Timestamp order_created_at = 9;
  google.protobuf.Timestamp source_updated_at = 10;
  optional int64 source_version = 11;
}

message WirePayEventEnvelopeOfOrderRefundSummaryEventDTO {
  optional string delivery_id = 1;
  optional string business_event_id = 2;
  optional string producer = 3;
  optional string event_type = 4;
  optional int32 schema_version = 5;
  optional string aggregate_id = 6;
  optional int64 aggregate_version = 7;
  google.protobuf.Timestamp occurred_at = 8;
  loadup.pay.payment.v1.WireOrderRefundSummaryEventDTO data = 9;
}

message WireFeeRefundAckDTO {
  optional string delivery_id = 1;
  optional string business_event_id = 2;
  optional string order_id = 3;
  optional int64 source_version = 4;
  optional int64 applied_version = 5;
  optional bool accepted = 6;
}

service AcquireRpc {
  rpc PaymentOutcome (WirePayEventEnvelopeOfPaymentOutcomeEventDTO) returns (WirePaymentOutcomeAckDTO);
  rpc FeeRefund (WirePayEventEnvelopeOfOrderRefundSummaryEventDTO) returns (WireFeeRefundAckDTO);
}
