spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${PRODUCT_JDBC_URL}
    username: ${PRODUCT_JDBC_USERNAME}
    password: ${PRODUCT_JDBC_PASSWORD}
  application:
    name: product
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 1MB
  http:
    client:
      tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
    clients:
      limitcenter:
        base-url: ${LIMITCENTER_BASE_URL:http://limitcenter:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
      customer:
        base-url: ${CUSTOMER_BASE_URL:http://customer:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 65536
        max-response-bytes: 65536
  modules:
    contract:
      enabled: false
    product:
      materialize-seconds: ${PRODUCT_MATERIALIZE_SECONDS:300}
      customer-audience: ${CUSTOMER_JWT_AUDIENCE:customer}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  outbox:
    enabled: true
    worker-enabled: true
    poll-interval: 1s
    lease: 2m
    retry-delay: 5s
    max-attempts: 8
    batch-size: 20
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${PRODUCT_JWT_ISSUER_URI:${JWT_ISSUER_URI:}}
      audience: ${PRODUCT_JWT_AUDIENCE:product}
      jwk-set-uri: ${PRODUCT_JWT_JWK_SET_URI:${JWT_JWK_SET_URI:}}
      public-key-location: ${PRODUCT_JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION:}}

pay:
  service-auth:
    token-uri: ${SERVICE_AUTH_TOKEN_URI:http://authserver:8080/oauth2/token}
    allow-insecure-http: ${SERVICE_AUTH_ALLOW_INSECURE_HTTP:false}
    client-secret: ${SERVICE_AUTH_CLIENT_SECRET}
    registrations:
      limitcenter:
        client-id: ${PRODUCT_LIMITCENTER_OAUTH_CLIENT_ID:product.default.limitcenter}
        tenant-id: ${SERVICE_AUTH_TENANT_ID:__default__}
        service-id: product
        audience: limitcenter
        scopes:
          - pay:limit:activate
