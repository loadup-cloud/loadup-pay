spring:
  datasource:
    url: ${PRODUCT_JDBC_URL}
    username: ${PRODUCT_JDBC_USERNAME}
    password: ${PRODUCT_JDBC_PASSWORD}
  application:
    name: product
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: product
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.product
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  modules:
    contract:
      enabled: false
    product:
      materialize-seconds: ${PRODUCT_MATERIALIZE_SECONDS:300}
      customer-audience: ${CUSTOMER_JWT_AUDIENCE:${loadup.rpc.client.audience:customer}}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  outbox:
    enabled: true
    worker-enabled: true
    poll-interval: 1s
    lease: 2m
    retry-delay: 5s
    max-attempts: 8
    batch-size: 20
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${PRODUCT_JWT_ISSUER_URI}
      audience: ${PRODUCT_JWT_AUDIENCE:${loadup.rpc.client.audience:product}}
      jwk-set-uri: ${PRODUCT_JWT_JWK_SET_URI}

---
spring:
  config:
    activate:
      on-profile: "!nacos"
dubbo:
  registry:
    address: N/A
  reference:
    "io.github.loadup.pay.customer.rpc.proto.CustomerRpc":
      url: tri://customer-headless:50051
    "io.github.loadup.pay.limitcenter.rpc.proto.LimitCenterRpc":
      url: tri://limitcenter-headless:50051
