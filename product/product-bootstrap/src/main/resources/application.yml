spring:
  datasource:
    url: ${PRODUCT_JDBC_URL}
    username: ${PRODUCT_JDBC_USERNAME}
    password: ${PRODUCT_JDBC_PASSWORD}
  application:
    name: product
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  http:
    clients:
      limitcenter:
        base-url: ${LIMITCENTER_BASE_URL:http://limitcenter:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
      customer:
        base-url: ${CUSTOMER_BASE_URL:http://customer:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 3s
        max-connections: 50
        max-connections-per-route: 20
        max-request-bytes: 65536
        max-response-bytes: 65536
  modules:
    contract:
      enabled: false
    product:
      materialize-seconds: ${PRODUCT_MATERIALIZE_SECONDS:300}
      customer-audience: ${CUSTOMER_JWT_AUDIENCE:customer}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  outbox:
    enabled: true
    worker-enabled: true
    poll-interval: 1s
    lease: 2m
    retry-delay: 5s
    max-attempts: 8
    batch-size: 20
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${PRODUCT_JWT_ISSUER_URI}
      audience: ${PRODUCT_JWT_AUDIENCE:product}
      jwk-set-uri: ${PRODUCT_JWT_JWK_SET_URI}
