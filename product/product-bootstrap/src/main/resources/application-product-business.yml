# Assemble the artifact with Maven profile product-business and activate this Spring profile.
spring:
  datasource:
    url: ${PRODUCT_JDBC_URL}
    username: ${PRODUCT_JDBC_USERNAME}
    password: ${PRODUCT_JDBC_PASSWORD}
loadup:
  modules:
    contract:
      enabled: false
    product:
      materialize-seconds: ${PRODUCT_MATERIALIZE_SECONDS:300}
      customer-audience: ${CUSTOMER_JWT_AUDIENCE}
      publication:
        tenant-id: ${PRODUCT_PUBLICATION_TENANT_ID}
        token-file: ${PRODUCT_LIMITCENTER_TOKEN_FILE}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  outbox:
    enabled: true
    worker-enabled: true
    poll-interval: 1s
    lease: 2m
    retry-delay: 5s
    max-attempts: 8
    batch-size: 20
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${PRODUCT_JWT_ISSUER_URI}
      audience: ${PRODUCT_JWT_AUDIENCE}
      jwk-set-uri: ${PRODUCT_JWT_JWK_SET_URI}
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
