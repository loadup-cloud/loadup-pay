apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pay-operator
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-pay-operator
  namespace: loadup-pay
rules:
  - apiGroups: [""]
    resources: [pods, services, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [acquire, payment, customer, product, limitcenter, realtime]
    verbs: [get, patch, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-pay-operator
  namespace: loadup-pay
subjects:
  - kind: ServiceAccount
    name: pay-operator
    namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-pay-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-pay-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-pay-namespaces
subjects:
  - kind: ServiceAccount
    name: pay-operator
    namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-pay-namespaces
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  selector: {app: headlamp}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels: {app: headlamp}
  template:
    metadata:
      labels: {app: headlamp}
    spec:
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0
          args: ["-in-cluster", "-plugins-dir=/headlamp/plugins"]
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: timezone
              mountPath: /etc/localtime
              subPath: Shanghai
              readOnly: true
            - name: timezone
              mountPath: /usr/share/zoneinfo/Asia/Shanghai
              subPath: Shanghai
              readOnly: true
          ports:
            - {name: http, containerPort: 4466}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: timezone
          configMap:
            name: headlamp-timezone
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-timezone
  namespace: headlamp
binaryData:
  Shanghai: 
