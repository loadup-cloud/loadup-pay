apiVersion: v1
kind: Namespace
metadata:
  name: loadup-pay
---
# Payment Service - Headless for Dubbo Triple discovery
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: loadup-pay
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
      labels: { app: payment }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: payment
          image: loadup-pay/payment:bootstrap
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
            - { name: dubbo, containerPort: 50051 }
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secret
          env:
            - name: METRICS_ENABLED
              value: "true"
            - name: OTLP_TRACING_ENDPOINT
              value: "http://cluster.local/v1/traces"
          volumeMounts:
            - name: service-secrets
              mountPath: /var/run/loadup/secrets
              readOnly: true
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
      volumes:
        - name: service-secrets
          secret:
            secretName: payment-secret
---
# Payment ClusterIP - HTTP only for client routing
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: loadup-pay
spec:
  selector: { app: payment }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Payment Headless Service - Dubbo Triple discovery
apiVersion: v1
kind: Service
metadata:
  name: payment-headless
  namespace: loadup-pay
spec:
  clusterIP: None
  selector: { app: payment }
  ports:
    - { name: dubbo, port: 50051, targetPort: dubbo }
