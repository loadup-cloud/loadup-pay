{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "authserver-http-ingress",
    "namespace": "loadup-pay"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "authserver"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "loadup-pay"
              }
            },
            "podSelector": {
              "matchExpressions": [
                {
                  "key": "app",
                  "operator": "In",
                  "values": [
                    "merchantcenter",
                    "productcenter",
                    "limitcenter",
                    "payment",
                    "acquire",
                    "realtime",
                    "reconciliation"
                  ]
                }
              ]
            }
          },
          {
            "namespaceSelector": {
              "matchLabels": {
                "kubernetes.io/metadata.name": "observability"
              }
            },
            "podSelector": {
              "matchLabels": {
                "loadup.io/metrics-scraper": "true"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ]
  }
}
