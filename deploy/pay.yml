---
# Requires a CNI that enforces NetworkPolicy. Other policies must not grant
# broader ingress to TCP 50051, since NetworkPolicy rules are additive.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-internal-rpc
  namespace: loadup-pay
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [payment, acquire, customer, limitcenter, product, realtime, reconciliation]
  policyTypes: [Ingress]
  ingress:
    # A podSelector without a namespaceSelector matches this namespace only.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 50051
    # Preserve access to other ports and protocols.
    - ports:
        - { protocol: TCP, port: 1, endPort: 50050 }
        - { protocol: TCP, port: 50052, endPort: 65535 }
        - { protocol: UDP, port: 1, endPort: 65535 }
        - { protocol: SCTP, port: 1, endPort: 65535 }
