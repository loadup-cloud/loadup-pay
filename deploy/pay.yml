apiVersion: v1
kind: Namespace
metadata:
  name: loadup-pay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: loadup-pay
spec:
  replicas: 1
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payment
          image: loadup-pay/payment:bootstrap
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: JAVA_TOOL_OPTIONS
              value: -Duser.timezone=Asia/Shanghai
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: loadup-pay
spec:
  selector: {app: payment}
  ports:
    - {name: http, port: 8080, targetPort: http}
