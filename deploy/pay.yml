# AuthServer - internal OAuth2 client credentials / public JWKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authserver
  namespace: loadup-pay
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: authserver }
  template:
    metadata:
      labels: { app: authserver }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 100
      containers:
        - name: authserver
          image: loadup-pay/authserver:bootstrap
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef:
                name: authserver-config
            - secretRef:
                name: authserver-secret
          volumeMounts:
            - name: signing-keys
              mountPath: /var/run/loadup/secrets
              readOnly: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 180
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
      volumes:
        - name: signing-keys
          secret:
            secretName: authserver-files
---
apiVersion: v1
kind: Service
metadata:
  name: authserver
  namespace: loadup-pay
spec:
  selector: { app: authserver }
  ports:
    - { name: http, port: 8080, targetPort: http }
