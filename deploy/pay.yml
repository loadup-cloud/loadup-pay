# Rendering template: bind explicit image/configuration versions with scripts/render.sh; do not apply directly.
apiVersion: v1
kind: Namespace
metadata:
  name: loadup-pay
---
# Payment Service - JWT-authenticated HTTP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: loadup-pay
spec:
  replicas: 1
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
      labels: { app: payment }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 100
      containers:
        - name: payment
          image: loadup-pay/payment:bootstrap
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-secret
          env:
            - name: METRICS_ENABLED
              value: "true"
            - name: OTLP_TRACING_ENDPOINT
              value: "http://cluster.local/v1/traces"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 180
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ ALL ] }
---
# Payment ClusterIP - HTTP only for client routing
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: loadup-pay
spec:
  selector: { app: payment }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
