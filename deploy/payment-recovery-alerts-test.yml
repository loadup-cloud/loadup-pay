      - series: 'loadup_payment_recovery_inventory_unknown_oldest_age_seconds{job="loadup-pay",instance="payment-test:8080",application="payment",kind="payment"}'
        values: '90000x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LoadUpPaymentUnknownNeedsReview
        exp_alerts: [ ]
      - eval_time: 6m
        alertname: LoadUpPaymentUnknownUrgent
        exp_alerts: [ ]
      - eval_time: 6m
        alertname: LoadUpPaymentRecoveryInventoryUnavailable
        exp_alerts:
          - exp_labels:
              job: loadup-pay
              instance: payment-test:8080
              application: payment
              severity: warning
            exp_annotations:
              summary: "Payment recovery inventory has no fresh complete sample"
              description: "Check configured tenant scope, scheduler, read-only snapshot and refresh failures. Missing/stale inventory is not zero UNKNOWN transactions. Target-down and missing-meter alerts are separate."
