spring:
  application:
    name: merchantmng
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 75s
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
loadup:
  webmvc:
    request-body:
      path-prefix: /api/
      max-size: 1MB
  security:
    resource-server:
      enabled: true
      issuer-uri: ${JWT_ISSUER_URI}
      audience: merchantmng
      jwk-set-uri: ${JWT_JWK_SET_URI}
  http:
    clients:
      merchantcenter:
        base-url: ${MERCHANTCENTER_BASE_URL:http://merchantcenter:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 5s
        max-connections: 30
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
      productcenter:
        base-url: ${PRODUCTCENTER_BASE_URL:http://productcenter:8080}
        allow-private-addresses: true
        connect-timeout: 1s
        acquire-timeout: 1s
        read-timeout: 5s
        max-connections: 30
        max-connections-per-route: 20
        max-request-bytes: 1048576
        max-response-bytes: 1048576
