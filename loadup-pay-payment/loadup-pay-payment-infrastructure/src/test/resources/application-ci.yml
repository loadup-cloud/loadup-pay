spring:
  main:
    web-application-type: none
loadup:
  task:
    enabled: true
    max-attempts: 1
    worker-enabled: false
  database:
    schema: loadup_payment
  flyway:
    enabled: true
    locations: classpath:db/migration/pay/payment
  security:
    resource-server:
      enabled: false
    service-auth:
      token-uri: https://oauth2-server.invalid/oauth2/token
      client-secret: test-service-secret
      registrations:
        internal:
          scopes:
            - internal
  kms:
    enabled: false
