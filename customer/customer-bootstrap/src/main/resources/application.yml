spring:
  datasource:
    url: ${CUSTOMER_JDBC_URL}
    username: ${CUSTOMER_JDBC_USERNAME}
    password: ${CUSTOMER_JDBC_PASSWORD}
  application:
    name: customer
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: customer
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.customer
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  registry:
    address: N/A
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${CUSTOMER_JWT_ISSUER_URI}
      audience: ${CUSTOMER_JWT_AUDIENCE:${loadup.rpc.client.audience:customer}}
      jwk-set-uri: ${CUSTOMER_JWT_JWK_SET_URI}
