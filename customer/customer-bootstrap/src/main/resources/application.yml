spring:
  application:
    name: customer
server:
  port: 50051
server.rpc.dubbo:
  inbound:
    max-size: 256KB
  shutdown:
    grace-period: 30s
  clients:
    limitcenter:
      target: dns:///limitcenter-headless:50051
      default:
        load-balancing-policy: round_robin
    customer:
      target: dns:///customer-headless:50051
      default:
        load-balancing-policy: round_robin
  deadline: 3s
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
