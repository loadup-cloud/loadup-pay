# Requires an artifact assembled with Maven profile customer-business.
spring:
  datasource:
    url: ${CUSTOMER_JDBC_URL}
    username: ${CUSTOMER_JDBC_USERNAME}
    password: ${CUSTOMER_JDBC_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
loadup:
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${CUSTOMER_JWT_ISSUER_URI}
      audience: ${CUSTOMER_JWT_AUDIENCE}
      jwk-set-uri: ${CUSTOMER_JWT_JWK_SET_URI}
management:
  endpoint:
    health:
      group:
        readiness:
          include:
            - readinessState
            - db
