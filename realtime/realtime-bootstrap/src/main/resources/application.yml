spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      propagate-context: true
  lifecycle:
    timeout-per-shutdown-phase: 75s
  datasource:
    url: ${REALTIME_JDBC_URL}
    username: ${REALTIME_JDBC_USERNAME}
    password: ${REALTIME_JDBC_PASSWORD}
  application:
    name: realtime
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  webmvc:
    request-body:
      path-prefix: /api/internal/
      max-size: 32MB
  modules:
    realtime:
      payment-service-id: ${REALTIME_PAYMENT_SERVICE_ID:payment}
      acquire-service-id: ${REALTIME_ACQUIRE_SERVICE_ID:acquire}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${REALTIME_JWT_ISSUER_URI:${JWT_ISSUER_URI:}}
      audience: ${REALTIME_JWT_AUDIENCE:realtime}
      jwk-set-uri: ${REALTIME_JWT_JWK_SET_URI:${JWT_JWK_SET_URI:}}
      public-key-location: ${REALTIME_JWT_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION:}}
