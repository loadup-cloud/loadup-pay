spring:
  datasource:
    url: ${REALTIME_JDBC_URL}
    username: ${REALTIME_JDBC_USERNAME}
    password: ${REALTIME_JDBC_PASSWORD}
  application:
    name: realtime
server:
  port: 8080
  shutdown: graceful
dubbo:
  application:
    name: realtime
    qos-enable: false
  scan:
    base-packages: io.github.loadup.pay.realtime
  protocol:
    name: tri
    port: 50051
    triple:
      max-body-size: 33554432
      max-response-body-size: 33554432
  consumer:
    check: false
    timeout: 3000
    retries: 0
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: [ readinessState, db ]
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_ENABLED:false}
  metrics:
    enable:
      all: ${METRICS_ENABLED:false}
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

loadup:
  modules:
    realtime:
      payment-service-id: ${REALTIME_PAYMENT_SERVICE_ID:payment}
      acquire-service-id: ${REALTIME_ACQUIRE_SERVICE_ID:acquire}
  database:
    multi-tenant:
      enabled: true
      required: true
      request:
        header-name: ""
        parameter-name: ""
        subdomain-enabled: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
  security:
    resource-server:
      enabled: true
      issuer-uri: ${REALTIME_JWT_ISSUER_URI}
      audience: ${REALTIME_JWT_AUDIENCE:${loadup.rpc.client.audience:realtime}}
      jwk-set-uri: ${REALTIME_JWT_JWK_SET_URI}

---
spring:
  config:
    activate:
      on-profile: "!nacos"
dubbo:
  registry:
    address: N/A
