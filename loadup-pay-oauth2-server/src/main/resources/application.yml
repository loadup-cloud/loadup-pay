spring:
  application:
    name: oauth2-server
  datasource:
    url: ${AUTHSERVER_JDBC_URL}
    username: ${AUTHSERVER_JDBC_USERNAME}
    password: ${AUTHSERVER_JDBC_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 75s
  threads:
    virtual:
      enabled: false
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: [readinessState, db]
loadup:
  deployment:
    code: ${DEPLOYMENT_CODE:}
  database:
    schema: ${DEPLOYMENT_DATABASE_SCHEMA:}
  flyway:
    enabled: true
    locations:
      - classpath:db/loadup-oauth
      - classpath:db/migration/pay/oauth2-server
      - classpath:db/migration/framework/audit
  kms:
    enabled: true
    binder: local
    local:
      key-store-location: ${AUTHSERVER_KEYSTORE_LOCATION:file:/var/run/loadup/secrets/oauth2-server.p12}
      key-store-type: PKCS12
      key-store-password-env: KMS_KEYSTORE_PASSWORD
  security:
    resource-server:
      enabled: true
      issuer-uri: ${OAUTH_MANAGEMENT_ISSUER_URI:http://admin:8080}
      audience: ${OAUTH_MANAGEMENT_AUDIENCE:admin}
      jwk-set-uri: ${OAUTH_MANAGEMENT_JWK_SET_URI:http://admin:8080/oauth2/jwks}
    oauth:
      persistence:
        enabled: true
    auth-server:
      enabled: true
      issuer: ${JWT_ISSUER_URI:http://oauth2-server.loadup-pay.svc.cluster.local:8080}
      # Protocol is owned by the service-only application configuration (no OIDC/user login).
      protocol-endpoints-enabled: false
      signing:
        active-key:
          name: ${AUTHSERVER_SIGNING_KEY:auth-jwt}
          version: 1

# Only management HTTP requests are auto-audited; protocol token requests never enter MVC audit.
# Explicit OAUTH_CLIENT_* success records are committed with the corresponding database mutation.
loadup.modules.audit.web.include-paths: /api/internal/v1/oauth/clients/**
